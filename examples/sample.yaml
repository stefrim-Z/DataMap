name: DataMap — Sample YAML Config
version: "2.1.0"
active: true

server:
  host: 0.0.0.0
  port: 8080
  debug: false
  workers: 4
  timeout: 30

database:
  engine: postgresql
  host: localhost
  port: 5432
  name: appdb
  pool:
    min_size: 2
    max_size: 20
    timeout: 30

logging:
  level: INFO
  handlers:
    - type: console
      format: "%(asctime)s [%(levelname)s] %(message)s"
    - type: file
      path: /var/log/app.log
      max_bytes: 10485760
      backup_count: 5

features:
  dark_mode: true
  analytics: false
  beta_users:
    - alice@example.com
    - bob@example.com

secrets: null
