[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datamap"
version = "1.0.0"
description = "Visualize any JSON, YAML, TOML, or .env data as a stunning color-coded tree in your terminal."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "DataMap Contributors" },
]
keywords = [
    "json", "yaml", "toml", "cli", "terminal", "tree", "visualizer",
    "developer-tools", "tui", "rich", "textual",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
tui = ["textual>=0.50.0"]
toml = ["tomli>=2.0.0; python_version < '3.11'"]
all = ["textual>=0.50.0", "tomli>=2.0.0; python_version < '3.11'"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
    "textual>=0.50.0",
    "tomli>=2.0.0",
]

[project.scripts]
datamap = "datamap.core:main"

[project.urls]
Homepage = "https://github.com/stefrim-Z/DataMap"
Documentation = "https://github.com/stefrim-Z/DataMap#readme"
Repository = "https://github.com/stefrim-Z/DataMap"
"Bug Tracker" = "https://github.com/stefrim-Z/DataMap/issues"
Changelog = "https://github.com/stefrim-Z/DataMap/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["datamap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 99
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["datamap"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
